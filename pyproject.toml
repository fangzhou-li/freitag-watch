[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freitag-watch"
version = "0.1.0"
description = "Low-impact FREITAG one-off inventory monitor"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Pillow>=10.0,<12",
  "requests>=2.31,<3",
]

[project.scripts]
freitag-watch = "freitag_watch.cli:main"

[tool.setuptools.packages.find]
include = ["freitag_watch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
